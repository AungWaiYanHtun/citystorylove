const DLG={

function blocked(x,z,r=0.3){for(const w of walls){const b=w.geometry.parameters,q=w.position;if(Math.abs(x-q.x)<b.width/2+r&&Math.abs(z-q.z)<b.depth/2+r)return true}

function tick(now){const dt=Math.min(0.05,(now-last)/1000);last=now;const t=now/1000;
  let ix=J.x,iy=J.y;if(keys.has('ArrowLeft')||keys.has('a'))ix=-1;if(keys.has('ArrowRight')||keys.has('d'))ix=1;if(keys.has('ArrowUp')||keys.has('w'))iy=-1;if(keys.has('ArrowDown')||keys.has('s'))iy=1;

    if(l>0.15&&mode==='walk'){const sp=(run?5.6:2.9)*Math.min(1,l);const nx=P.position.x+ix/l*sp*dt,nz=P.position.z+iy/l*sp*dt;

    wheels.forEach(w=>w.rotation.x+=C.sp*dt*1.7);const g=Math.sin(t*C.sp*1.6)*Math.min(0.6,Math.abs(C.sp)*0.08);legs.forEach((l,i)=>l.rotation.x=(i%3?g:-g));
    tmp.set(car.position.x-Math.sin(car.rotation.y)*9,5,car.position.z-Math.cos(car.rotation.y)*9+3);cam.position.lerp(tmp,0.08);cam.lookAt(car.position.x,1.4,car.position.z);}
